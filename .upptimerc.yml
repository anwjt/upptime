  - name: Google Maps Reviews (ระบบดึงข้อมูลรีวิว)
    url: https://sahapanich.digital/api/places/reviews
    expectedStatusCodes: [200, 400, 401, 405]
status-website:
  # ตั้งค่าผูกโดเมน
  cname: status.sahapanich.digital
  name: Sahapanich System Status
  introTitle: "รายงานสถานะระบบของ สหพานิช"
  introMessage: "หน้านี้จะแสดงสถานะการทำงานของเซิร์ฟเวอร์แบบ Real-time หากระบบขัดข้อง บอทจะแจ้งเตือนและบันทึกเวลาไว้ที่นี่โดยอัตโนมัติ"
  theme: light
 
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

