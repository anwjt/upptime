    url: https://sahapanich.digital
  
  - name: Admin Dashboard (ระบบจัดการหลังบ้าน)
    url: https://sahapanich.digital/admin/member_sp
    
  - name: LINE Messaging API (ระบบส่งข้อความ)
    url: https://sahapanich.digital/api/admin/line/push
